<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa Interactiva</title>
    <style>
        /* --- VARIABLES DE COLORES --- */
        :root {
            --color-fondo: #fdf2f8; 
            --color-texto: #333333; 
            --color-acentos: #ec4899;         
            --color-tarjetas: #ffffff;        
            --color-sombra: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--color-fondo);
            color: var(--color-texto);
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1, h2 { color: var(--color-acentos); margin-bottom: 15px; }

        header { margin-bottom: 30px; }

        button {
            background-color: var(--color-acentos);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* --- RELOJ Y BLOQUEO --- */
        #temporizador {
            font-size: 24px; font-weight: bold; background: var(--color-tarjetas);
            display: inline-block; padding: 15px 30px; border-radius: 10px;
            box-shadow: 0 4px 6px var(--color-sombra); margin-bottom: 20px;
        }

        #input-clave {
            padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc;
        }

        /* --- FORMULARIO Y CARTA --- */
        .carta-contenedor, #formulario-recuerdos {
            background: var(--color-tarjetas); max-width: 500px; margin: 0 auto 30px auto;
            padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px var(--color-sombra);
        }
        
        #formulario-recuerdos input[type="text"], #formulario-recuerdos textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;
        }

        /* --- MURO DE FOTOS (POLAROID) --- */
        .contenedor-fotos {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
        }
        .foto-item {
            background: var(--color-tarjetas); padding: 15px 15px 30px 15px;
            border-radius: 5px; box-shadow: 0 4px 8px var(--color-sombra);
            width: 250px; text-align: center;
        }
        .foto-item img { width: 100%; border-radius: 3px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- MÚSICA DE FONDO -->
    <audio id="musica-fondo" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <header>
        <h1 id="titulo-principal">Cargando sorpresa...</h1>
        <p id="subtitulo"></p>
        <button id="btn-play-musica">Reproducir Música 🎵</button>
    </header>

    <!-- PANTALLA DE BLOQUEO Y RELOJ -->
    <section id="pantalla-bloqueo">
        <h2 id="texto-estado">La sorpresa se desbloqueará en:</h2>
        <div id="temporizador">
            <span>0d</span> : <span>0h</span> : <span>0m</span> : <span>0s</span>
        </div>
        
        <div id="zona-clave" style="display: none;">
            <p>¡El tiempo terminó! Ingresa la clave secreta:</p>
            <input type="password" id="input-clave" placeholder="Clave secreta">
            <button id="btn-desbloquear">Desbloquear</button>
            <p id="error-clave" style="color: red; display: none; margin-top: 10px;">Clave incorrecta.</p>
        </div>
    </section>

    <!-- CONTENIDO SORPRESA (OCULTO) -->
    <section id="contenido-sorpresa" style="display: none;">
        
        <button id="btn-ocultar" style="background-color: #555; margin-bottom: 30px;">🔒 Volver a Ocultar</button>

        <div class="carta-contenedor">
            <h2>Un mensaje especial</h2>
            <p id="mensaje-texto"></p>
            <p id="firma-texto" style="font-weight: bold; text-align: right; margin-top: 15px; font-style: italic;"></p>
        </div>

        <h2>Sube tu recuerdo al muro</h2>
        <div id="formulario-recuerdos">
            <input type="text" id="input-nombre" placeholder="Tu nombre">
            <textarea id="input-mensaje" placeholder="Escribe un mensaje o anécdota..." rows="3"></textarea>
            <input type="file" id="input-foto-individual" accept="image/*" style="width: 100%; margin-bottom: 15px;">
            <button id="btn-subir-recuerdo" style="width: 100%;">Publicar Recuerdo en el Muro</button>
        </div>
        
        <div id="muro-interactivo" class="contenedor-fotos"></div>
    </section>

    <script>
        // --- 1. CONFIGURACIÓN DEL CLIENTE ---
        // (La fecha está en el pasado para que puedas probar la clave de inmediato)
        const configCliente = {
            nombre: "Camila",
            edad: "25",
            fraseIntro: "Que este nuevo año esté lleno de sorpresas.",
            fechaEvento: "2026-08-20 00:00:00", 
            mensajePrincipal: "Eres una persona increíble, gracias por todas las aventuras juntos y por estar siempre ahí. ¡Espero que disfrutes tu día al máximo!",
            quienRegala: "Juan",
            claveSecreta: "1234"
        };

        // --- 2. CARGAR TEXTOS AL INICIAR ---
        document.getElementById('titulo-principal').innerText = `¡Felices ${configCliente.edad} años, ${configCliente.nombre}!`;
        document.getElementById('subtitulo').innerText = configCliente.fraseIntro;
        document.getElementById('mensaje-texto').innerText = configCliente.mensajePrincipal;
        document.getElementById('firma-texto').innerText = `Con cariño, ${configCliente.quienRegala}`;

        // --- 3. LÓGICA DEL RELOJ ---
        const fechaFin = new Date(configCliente.fechaEvento).getTime();
        const intervalo = setInterval(() => {
            const ahora = new Date().getTime();
            const distancia = fechaFin - ahora;

            if (distancia > 0) {
                const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
                const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((distancia % (1000 * 60)) / 1000);
                document.getElementById('temporizador').innerHTML = `<span>${dias}d</span> : <span>${horas}h</span> : <span>${minutos}m</span> : <span>${segundos}s</span>`;
            } else {
                clearInterval(intervalo);
                document.getElementById('temporizador').style.display = "none";
                document.getElementById('texto-estado').style.display = "none";
                document.getElementById('zona-clave').style.display = "block";
            }
        }, 1000);

        // --- 4. BOTONES: DESBLOQUEAR Y OCULTAR ---
        document.getElementById('btn-desbloquear').addEventListener('click', () => {
            if (document.getElementById('input-clave').value === configCliente.claveSecreta) {
                document.getElementById('pantalla-bloqueo').style.display = 'none';
                document.getElementById('contenido-sorpresa').style.display = 'block';
            } else {
                document.getElementById('error-clave').style.display = 'block';
            }
        });

        document.getElementById('btn-ocultar').addEventListener('click', () => {
            document.getElementById('contenido-sorpresa').style.display = 'none';
            document.getElementById('pantalla-bloqueo').style.display = 'block';
            document.getElementById('input-clave').value = '';
            document.getElementById('error-clave').style.display = 'none';
        });

        // --- 5. CARGAR FOTO AL MURO ---
        document.getElementById('btn-subir-recuerdo').addEventListener('click', () => {
            const archivo = document.getElementById('input-foto-individual').files[0];
            const nombre = document.getElementById('input-nombre').value;
            const mensaje = document.getElementById('input-mensaje').value;

            if (archivo && nombre && mensaje) {
                const lector = new FileReader();
                lector.onload = function(e) {
                    const nuevaFoto = document.createElement('div');
                    nuevaFoto.className = 'foto-item';
                    nuevaFoto.innerHTML = `
                        <img src="${e.target.result}">
                        <p style="font-weight: bold; margin-top: 10px;">${nombre}</p>
                        <p style="font-size: 14px; margin-top: 5px;">"${mensaje}"</p>
                    `;
                    document.getElementById('muro-interactivo').appendChild(nuevaFoto);
                    
                    document.getElementById('input-nombre').value = '';
                    document.getElementById('input-mensaje').value = '';
                    document.getElementById('input-foto-individual').value = '';
                };
                lector.readAsDataURL(archivo);
            } else {
                alert("Llena tu nombre, mensaje y elige una foto.");
            }
        });

        // --- 6. MÚSICA ---
        const btnMusica = document.getElementById('btn-play-musica');
        const audioFondo = document.getElementById('musica-fondo');
        btnMusica.addEventListener('click', () => {
            if (audioFondo.paused) {
                audioFondo.play();
                btnMusica.innerText = "Pausar Música ⏸️";
            } else {
                audioFondo.pause();
                btnMusica.innerText = "Reproducir Música 🎵";
            }
        });
    </script>
</body>
</html>
